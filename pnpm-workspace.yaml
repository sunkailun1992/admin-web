packages:
  - apps/*
  - packages/*

# 全仓库共用的依赖版本（pnpm catalog），各包写 "catalog:" 引用；第6阶段第四部分写计划时的 npm latest。
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  react-router: ^8.5.2
  vite: ^8.3.8
  '@vitejs/plugin-react': ^6.3.0
  '@module-federation/vite': ^1.24.1
  '@module-federation/runtime': ^2.9.3
  '@module-federation/retry-plugin': ^2.9.3
  tailwindcss: ^4.3.5
  '@tailwindcss/vite': ^4.3.5
  lucide-react: ^1.77.0
  sonner: ^2.0.8
  '@tanstack/react-query': ^5.108.2
  '@tanstack/react-table': ^9.3.1
  react-hook-form: ^7.92.0
  zod: ^4.6.7
  '@hookform/resolvers': ^7.0.8
  axios: ^1.21.1
  recharts: ^3.11.0
  cytoscape: ^3.35.0
  i18next: ^27.2.3
  react-i18next: ^18.0.3
  storybook: ^10.6.8
  '@storybook/react-vite': ^10.6.8
  style-dictionary: ^5.8.0
  colorjs.io: ^0.7.1
  turbo: ^2.11.13
  vitest: ^5.1.1
  '@testing-library/react': ^16.3.3
  jsdom: ^31.0.1
  msw: ^3.0.7
  '@playwright/test': ^1.65.1
  eslint: ^10.15.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.73.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-config-prettier: ^10.1.8
  globals: ^17.14.0
  prettier: ^3.10.1
  prettier-plugin-organize-imports: ^4.3.0
  prettier-plugin-packagejson: ^3.1.0
  typescript: ^6.0.3
  '@types/node': ^26.6.6
  husky: ^9.1.7
  lint-staged: ^17.6.2

allowBuilds:
  core-js: false
  core-js-pure: false
  es5-ext: false
  esbuild: false

minimumReleaseAgeExclude:
  - lint-staged@17.6.2
