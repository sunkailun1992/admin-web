# Admin Web CI guards the executable part of the AI coding standard.
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-security:
    name: Build and Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm 版本取 package.json 的 packageManager（pnpm@12.21.0），这里不重复写。
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # 物料包的故事测试在浏览器里跑（Storybook 的 Vitest 插件）：CI 用 Playwright 自带的 Chromium。
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test

      # 浏览器测试步骤在第四部分任务14 加回（重写后的固定数据一组）。
      - name: Build with development configuration
        run: pnpm build:dev

      - name: Secret warning scan
        run: bash scripts/check-secrets.sh
