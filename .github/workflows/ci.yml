# Admin Web CI guards the executable part of the AI coding standard.
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      # 本仓库的短分支（AGENTS：新功能分支用 codex/ 前缀）推送后也跑，合入前就能看到结果。
      - 'codex/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-security:
    name: Build and Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm 版本取 package.json 的 packageManager（pnpm@12.21.0），这里不重复写。
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # 物料包的故事测试在浏览器里跑（Storybook 的 Vitest 插件）：CI 用 Playwright 自带的 Chromium。
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test

      - name: Build with development configuration
        run: pnpm build:dev

      # 固定数据一组浏览器测试：起五个预览服务，接口全部按 e2e/fixtures 回（Playwright 自带的 Chromium）。
      - name: Browser tests (fixture data)
        run: pnpm test:e2e

      - name: Upload browser test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-out
          path: e2e-out
          retention-days: 7

      # 新建子应用生成器：生成 apps/gen-check 并 typecheck、test、build，结束后还原工作区。
      - name: Generator check
        run: pnpm test:generator

      - name: Secret warning scan
        run: bash scripts/check-secrets.sh
