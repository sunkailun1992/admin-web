# Admin Web CI guards the executable part of the AI coding standard.
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-security:
    name: Build and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Service and request contract tests
        run: pnpm test:services

      - name: Build with development configuration
        run: pnpm build:dev

      - name: Secret warning scan
        run: bash scripts/check-secrets.sh
